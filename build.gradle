plugins {
    id 'eclipse'
    id 'groovy'
    id 'idea'
    id 'java-library'
    id 'maven-publish'
    id 'org.ajoberstar.grgit' version '2.2.1'
}

version = 'v24.0-SNAPSHOT'

java {
    // Emit Java 25 bytecode. Consumers of this artifact must run on JDK 25+.
    sourceCompatibility = 25
    targetCompatibility = 25

    withSourcesJar()
}

//tasks.withType(JavaCompile) {
//    options.compilerArgs += ['-Xlint:deprecation']
//}

def repo = org.ajoberstar.grgit.Grgit.open(currentDir: project.rootDir)

jar {
	
    archiveBaseName = 'graphql-jpa'
    version = project.version
    manifest {
        attributes 'Implementation-Revision': repo.head().getAbbreviatedId(8),
                   'Implementation-Branch': repo.branch.getCurrent().getName(),
                   'Implementation-Remote-URL': repo.remote.list().first().url,
				   'Built-By': System.properties['user.name']
    }
}

test {
    // Spock 2.x runs on the JUnit Platform; Gradle 9 no longer infers this.
    useJUnitPlatform()
}

repositories {
    mavenCentral()
}

configurations {
    provided
    compile.extendsFrom provided
}

dependencies {
    // graphql-java 25.x aligns with Spring for GraphQL 2.0.x (Spring Boot 4.1).
    // extended-scalars has no 25.x line yet; 24.0 is compatible with graphql-java 25.0.
    implementation 'com.graphql-java:graphql-java:25.0'
    implementation 'com.graphql-java:graphql-java-extended-scalars:24.0'
    // graphql-java 24 no longer brings slf4j transitively; declare it explicitly.
    implementation 'org.slf4j:slf4j-api:2.0.16'
    implementation 'jakarta.transaction:jakarta.transaction-api:2.0.1'
    // byte-buddy 1.17.x supports class-file redefinition on JDK 21/25.
    implementation 'net.bytebuddy:byte-buddy:1.17.8'
    implementation 'net.bytebuddy:byte-buddy-agent:1.17.8'
    // Jakarta EE 11 baseline (matches Spring Framework 7 / Spring Boot 4).
    implementation 'jakarta.servlet:jakarta.servlet-api:6.1.0'
    implementation 'jakarta.persistence:jakarta.persistence-api:3.2.0'
    implementation 'jakarta.platform:jakarta.jakartaee-api:11.0.0'

    // Spring Boot 4.x (Spring 7 / Jakarta EE 11) brings Hibernate 7, which
    // implements Jakarta Persistence 3.2 (jakarta.persistence.SchemaManager).
    // Spring Boot 3.5 pins Hibernate 6.6 (Jakarta Persistence 3.1), which
    // collides with the 3.2 API declared below via jakartaee-api:11.0.0.
    testImplementation "org.springframework.boot:spring-boot-starter:4.1.1"
    testImplementation "org.springframework.boot:spring-boot-starter-test:4.1.1"
    testImplementation "org.springframework.boot:spring-boot-starter-data-jpa:4.1.1"
    testImplementation "org.springframework.boot:spring-boot-starter-web:4.1.1"
    testImplementation 'junit:junit:4.13.2'
    // Groovy 5 / Spock 2.4-groovy-5.0 are required to read Java 25 (class file
    // major version 69) bytecode produced by the main source set.
    testImplementation 'org.spockframework:spock-core:2.4-groovy-5.0'
    testImplementation 'org.spockframework:spock-spring:2.4-groovy-5.0'
    testImplementation 'org.apache.groovy:groovy-all:5.0.8'
    testImplementation 'cglib:cglib-nodep:3.3.0'
    testImplementation 'org.objenesis:objenesis:3.4'

    testRuntimeOnly "com.h2database:h2:2.2.224"
}

publishing {
	publications {
		MyPublication(MavenPublication) {
			from components.java
			groupId 'com.crygier'
    		artifactId 'graphql-jpa'
    		version project.version
		}
	}
}

eclipse {
    classpath {
         containers.remove('org.eclipse.jdt.launching.JRE_CONTAINER')
         containers 'org.eclipse.jdt.launching.JRE_CONTAINER/org.eclipse.jdt.internal.debug.ui.launcher.StandardVMType/JavaSE-25'
    }
}

wrapper {
    gradleVersion = '9.2.0'
}
